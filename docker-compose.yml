services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bhoomi
      MYSQL_USER: bhoomi
      MYSQL_PASSWORD: bhoomi
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: .env.example
    ports: ["5000:5000"]
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  mysql_data:
